<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ZemaVoice AI</title>
<style>body{font:16px system-ui;background:#0b1020;color:#eef1ff;margin:0}.wrap{max-width:720px;margin:45px auto;padding:20px}.card{background:#151e33;border:1px solid #34415d;border-radius:16px;padding:25px}h1{font-size:40px}h1 span{color:#a68aff}p{color:#aab8d2}label{display:block;margin:14px 0 6px}input,textarea,select{box-sizing:border-box;width:100%;background:#0b1323;color:white;border:1px solid #3c4b6d;border-radius:10px;padding:12px;font:inherit}textarea{min-height:150px}button{background:#a68aff;color:#101020;font-weight:bold;border:0;border-radius:10px;padding:13px;margin-top:14px;width:100%;cursor:pointer}button:disabled{opacity:.5}audio{width:100%}#status{white-space:pre-wrap}a{color:#75dce2}</style></head>
<body><main class="wrap"><h1>Zema<span>Voice</span> AI</h1><p>ዜማ ቮይስ AI · Private beta · Amharic voice studio</p>
<div class="card"><label for="key">ZemaVoice API key</label><input type="password" id="key" autocomplete="off" placeholder="Enter private beta key">
<label for="text">Amharic script</label><textarea id="text">ሰላም! እንኳን ወደ ዜማ ቮይስ በደህና መጡ።</textarea>
<label for="voice">Voice</label><select id="voice"><option value="am-hamen">Amharic sample voice</option></select>
<button id="load">Load available voices</button><button id="generate">Generate Amharic speech</button>
<p id="status">This beta needs a server-side Addis AI key before speech works.</p><audio id="audio" controls hidden></audio><p id="download"></p></div>
<p>Provider credentials stay on the server. Speech generation may incur provider charges. ZemaVoice's own trained engine is still under development.</p></main>
<script>
const $=x=>document.getElementById(x);
const headers=()=>({'x-zemavoice-key':$('key').value});
$('load').onclick=async()=>{try{$('status').textContent='Loading…';let r=await fetch('/v1/voices',{headers:headers()}),j=await r.json();if(!r.ok)throw Error(j.detail||'Request failed');let a=Array.isArray(j)?j:(j.data?.voices||j.voices||j.data||[]);if(!Array.isArray(a))throw Error('Unexpected provider voice list');$('voice').replaceChildren(...a.map(v=>{let o=document.createElement('option');o.value=v.id;o.textContent=v.name||v.id;return o}));$('status').textContent=a.length+' voices loaded';}catch(e){$('status').textContent=e.message}};
$('generate').onclick=async()=>{let b=$('generate');b.disabled=true;$('audio').hidden=true;try{$('status').textContent='Generating…';let r=await fetch('/v1/tts',{method:'POST',headers:{...headers(),'content-type':'application/json'},body:JSON.stringify({text:$('text').value,voice_id:$('voice').value,language:'am',output_format:'mp3_44100'})}),j=await r.json();if(!r.ok)throw Error(j.detail||'Request failed');let clip=j.data||j,url=clip.audio_url||clip.audioUrl;if(!url)throw Error('No audio URL returned');$('audio').src=url;$('audio').hidden=false;let a=document.createElement('a');a.href=url;a.textContent='Open generated audio';a.target='_blank';a.rel='noopener noreferrer';$('download').replaceChildren(a);$('status').textContent='Generated. Audio links may expire.';}catch(e){$('status').textContent=e.message}finally{b.disabled=false}};
</script></body></html>
