name: Amharic dataset tooling checks
on:
  push:
    paths:
      - 'independent_engine/**'
      - '.github/workflows/amharic-data-checks.yml'
  pull_request:
    paths:
      - 'independent_engine/**'
      - '.github/workflows/amharic-data-checks.yml'
jobs:
  metadata-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Python scripts
        run: python -m compileall -q independent_engine
      - name: Test manifest validator with synthetic data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from independent_engine.validate_dataset import validate
          with TemporaryDirectory() as d:
              f = Path(d) / "manifest.jsonl"
              row = dict(audio_path="fake.wav", transcript="ሰላም", speaker_id="synthetic", consent_record="synthetic-test", license="CC0-1.0", split="train")
              f.write_text(json.dumps(row, ensure_ascii=False) + "\n", encoding="utf-8")
              assert not validate(f), validate(f)
              row["transcript"] = "hello"
              f.write_text(json.dumps(row, ensure_ascii=False) + "\n", encoding="utf-8")
              assert validate(f), "Expected invalid transcript to be rejected"
          PY
