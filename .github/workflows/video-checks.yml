name: Video app regression checks
on:
  pull_request:
    paths:
      - 'app.py'
      - 'lipsync_api.py'
      - 'gpu/**'
      - 'public/video*'
      - 'tests/**'
      - 'requirements*.txt'
      - '.github/workflows/video-checks.yml'
jobs:
  media-and-api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install -r requirements-dev.txt
      - name: Test API, worker and synthetic media
        run: python -m pytest -q
      - name: Check browser script syntax
        run: node --check public/video.js
